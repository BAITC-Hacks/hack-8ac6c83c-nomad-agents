services:
  firestore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud emulators firestore start --host-port=0.0.0.0:8080 --project=taskforge-local
    ports:
      - "${FIRESTORE_HOST_PORT:-8081}:8080"
    environment:
      CLOUDSDK_CORE_PROJECT: taskforge-local

  api:
    build: ./api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      FIRESTORE_EMULATOR_HOST: firestore:8080
      GCP_PROJECT_ID: taskforge-local
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    depends_on:
      - firestore
    volumes:
      - ./seed:/app/seed:ro

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "${WEB_HOST_PORT:-5173}:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api
